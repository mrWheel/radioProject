dependencies:
  idf: ">=5.2,<7.0"
  espressif/esp_audio_codec: "2.6.2"
  espressif/cjson: "^1.7.19"
  joltwallet/littlefs: "^1.20.0"
  mrwheel/ota_upload: "^0.1.0"

#-- ota_upload's own manifest also depends on michmich/esp-idf-wifi-provisioner;
#-- without this override the component manager fetches a second, separate
#-- copy into managed_components/ alongside the one already vendored at
#-- components/wifi_provisioner, and the two collide while embedding the same
#-- portal.html. override_path requires the target directory to be named
#-- after the (namespace-mangled) dependency name, which ours isn't, so use
#-- an `overrides` entry instead, which can point to a differently-named
#-- local component.
overrides:
  - michmich/esp-idf-wifi-provisioner:
      with:
        wifi_provisioner:
          path: "../components/wifi_provisioner"
      reason: "Already vendored locally as components/wifi_provisioner"

