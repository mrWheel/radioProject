<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Internet Radio</title>
  <style>
    :root {
      --bg: #f5f5f7;
      --panel: rgba(255,255,255,0.72);
      --panel-strong: rgba(255,255,255,0.9);
      --line: rgba(15,23,42,0.12);
      --text: #1d2733;
      --muted: #5c6b7a;
      --accent: #2f80ed;
      --accent-soft: rgba(47,128,237,0.12);
      --shadow: rgba(15,23,42,0.12);
      --danger: #d93025;
      --success: #2e7d32;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
      background: linear-gradient(180deg, #f4f4f8 0%, #e9edf4 100%);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }
    .window {
      width: min(720px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 20px 50px var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      overflow: hidden;
    }
    .titlebar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      background: rgba(255,255,255,0.24);
      border-bottom: 1px solid var(--line);
      font-weight: 600;
      letter-spacing: 0.02em;
    }
    .traffic {
      display: flex;
      gap: 8px;
    }
    .traffic span {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      background: #f0b646;
    }
    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }
    .content { padding: 24px; }
    .station-name {
      text-align: center;
      font-size: clamp(1.7rem, 3vw, 2.6rem);
      margin: 12px 0 18px;
      font-weight: 700;
      letter-spacing: -0.04em;
    }
    .meta {
      min-height: 92px;
      text-align: center;
      color: var(--muted);
      display: grid;
      place-content: center;
      gap: 6px;
    }
    .meta .artist { font-size: 1.1rem; font-weight: 600; }
    .meta .track { font-size: 1.35rem; font-weight: 500; }
    .controls { display: grid; gap: 16px; margin-top: 18px; }
    .nav-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }
    button {
      appearance: none;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,0.55);
      color: var(--text);
      padding: 12px 18px;
      font-size: 1rem;
      min-height: 44px;
      cursor: pointer;
      transition: transform 0.15s ease, background 0.15s ease;
    }
    button:hover { background: rgba(255,255,255,0.85); }
    button:active { transform: translateY(1px); }
    .primary {
      background: linear-gradient(180deg, rgba(47,128,237,0.12), rgba(47,128,237,0.04));
      border-color: rgba(47,128,237,0.3);
    }
    .slider-wrap {
      display: grid;
      gap: 10px;
      background: rgba(255,255,255,0.4);
      border-radius: 18px;
      border: 1px solid var(--line);
      padding: 18px 20px;
    }
    .slider-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
    }
    .volume-value {
      min-width: 56px;
      text-align: right;
      font-weight: 700;
      color: var(--muted);
    }
    .manage {
      display: flex;
      justify-content: center;
      margin-top: 8px;
    }
    .modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.2);
      padding: 20px;
    }
    .modal.open { display: flex; }
    .modal-card {
      width: min(480px, 100%);
      background: rgba(255,255,255,0.9);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: 0 30px 80px rgba(15,23,42,0.18);
      padding: 20px;
    }
    .modal h3 {
      margin: 0 0 18px;
      font-size: 1.25rem;
    }
    .field { display: grid; gap: 8px; margin-bottom: 14px; }
    label { font-weight: 600; font-size: 0.92rem; }
    input {
      width: 100%;
      min-height: 44px;
      border-radius: 12px;
      border: 1px solid rgba(15,23,42,0.15);
      padding: 10px 12px;
      font: inherit;
      background: rgba(255,255,255,0.8);
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 16px;
    }
    .danger { color: var(--danger); }
    .status {
      margin-top: 12px;
      min-height: 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    @media (max-width: 560px) {
      body { padding: 12px; }
      .window { border-radius: 18px; }
      .content { padding: 16px; }
      .slider-row, .nav-row, .modal-actions { flex-direction: column; }
      .slider-row > * { width: 100%; }
      .modal-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="window">
    <div class="titlebar">
      <div class="traffic"><span></span><span></span><span></span></div>
      <div>Internet Radio</div>
      <div></div>
    </div>
    <div class="content">
      <div id="stationName" class="station-name">Loading…</div>
      <div class="meta">
        <div id="artist" class="artist">No artist</div>
        <div id="track" class="track">No track information</div>
      </div>
      <div class="controls">
        <div class="nav-row">
          <button id="prevBtn" type="button">◀ Previous</button>
          <button id="nextBtn" type="button">Next ▶</button>
        </div>
        <div class="slider-wrap">
          <div class="slider-row">
            <span>Volume</span>
            <div id="volumeValue" class="volume-value">0%</div>
          </div>
          <input id="volumeSlider" type="range" min="0" max="100" value="0" />
        </div>
        <div class="manage">
          <button id="manageBtn" class="primary" type="button">Manage Stations</button>
        </div>
      </div>
      <div id="status" class="status">Connecting…</div>
    </div>
  </div>

  <div id="stationModal" class="modal" aria-hidden="true">
    <div class="modal-card">
      <h3 id="stationModalTitle">Station</h3>
      <div class="field">
        <label for="stationNameInput">Station Name</label>
        <input id="stationNameInput" type="text" maxlength="128" />
      </div>
      <div class="field">
        <label for="stationUrlInput">Stream URL</label>
        <input id="stationUrlInput" type="url" maxlength="1024" />
      </div>
      <div class="modal-actions">
        <button id="cancelStationBtn" type="button">Cancel</button>
        <button id="saveStationBtn" class="primary" type="button">Save</button>
      </div>
    </div>
  </div>

  <script>
    const state = {
      stationIndex: 0,
      stationCount: 0,
      volume: 0,
      artist: '',
      track: '',
      playing: false,
      streamConnected: false,
      stations: []
    };

    const els = {
      stationName: document.getElementById('stationName'),
      artist: document.getElementById('artist'),
      track: document.getElementById('track'),
      volumeValue: document.getElementById('volumeValue'),
      volumeSlider: document.getElementById('volumeSlider'),
      status: document.getElementById('status'),
      prevBtn: document.getElementById('prevBtn'),
      nextBtn: document.getElementById('nextBtn'),
      manageBtn: document.getElementById('manageBtn'),
      stationModal: document.getElementById('stationModal'),
      stationModalTitle: document.getElementById('stationModalTitle'),
      stationNameInput: document.getElementById('stationNameInput'),
      stationUrlInput: document.getElementById('stationUrlInput'),
      cancelStationBtn: document.getElementById('cancelStationBtn'),
      saveStationBtn: document.getElementById('saveStationBtn')
    };

    let ws = null;
    let retryMs = 1000;
    let lastSliderValue = 0;
    let stationEditorMode = 'add';
    let editingStationIndex = -1;
    let volumeTimer = null;

    function setStatus(message) {
      els.status.textContent = message;
    }

    function renderState(nextState) {
      if (!nextState) return;
      state.stationIndex = Number(nextState.stationIndex ?? 0);
      state.stationCount = Number(nextState.stationCount ?? 0);
      state.volume = Number(nextState.volume ?? 0);
      state.artist = nextState.artist || '';
      state.track = nextState.track || '';
      state.playing = !!nextState.playing;
      state.streamConnected = !!nextState.streamConnected;

      if (nextState.station && nextState.station.name) {
        els.stationName.textContent = nextState.station.name;
      }

      els.artist.textContent = state.artist || 'No artist';
      els.track.textContent = state.track || 'No track information';
      els.volumeSlider.value = String(state.volume);
      els.volumeValue.textContent = String(state.volume) + '%';

      if (state.streamConnected) {
        setStatus(state.playing ? 'Stream connected' : 'Ready');
      } else {
        setStatus('Waiting for stream');
      }
    }

    function sendMessage(payload) {
      if (!ws || ws.readyState !== WebSocket.OPEN) return;
      ws.send(JSON.stringify(payload));
    }

    function requestState() {
      sendMessage({ type: 'getState' });
    }

    function connectWebSocket() {
      ws = new WebSocket('ws://' + location.host + '/ws');
      ws.onopen = () => {
        retryMs = 1000;
        setStatus('Connected');
        requestState();
      };
      ws.onmessage = (event) => {
        try {
          const message = JSON.parse(event.data);
          if (message.type === 'state') {
            renderState(message.data);
          } else if (message.type === 'volume') {
            state.volume = Number(message.data.value ?? 0);
            els.volumeSlider.value = String(state.volume);
            els.volumeValue.textContent = String(state.volume) + '%';
          } else if (message.type === 'metadata') {
            if (message.data.artist) state.artist = message.data.artist;
            if (message.data.track) state.track = message.data.track;
            if (message.data.streamTitle) {
              const title = message.data.streamTitle;
              const sep = title.indexOf(' - ');
              if (sep > 0) {
                state.artist = title.slice(0, sep);
                state.track = title.slice(sep + 3);
              } else {
                state.track = title;
              }
            }
            els.artist.textContent = state.artist || 'No artist';
            els.track.textContent = state.track || 'No track information';
          } else if (message.type === 'stationList') {
            if (Array.isArray(message.data.stations)) {
              state.stations = message.data.stations;
            }
          } else if (message.type === 'error') {
            setStatus(message.data && message.data.message ? message.data.message : 'Command failed');
          }
        } catch (e) {
          setStatus('Message parse error');
        }
      };
      ws.onclose = () => {
        setStatus('WebSocket disconnected');
        setTimeout(connectWebSocket, retryMs);
        retryMs = Math.min(retryMs * 2, 10000);
      };
      ws.onerror = () => {
        setStatus('WebSocket error');
      };
    }

    els.prevBtn.addEventListener('click', () => sendMessage({ type: 'stationPrevious' }));
    els.nextBtn.addEventListener('click', () => sendMessage({ type: 'stationNext' }));

    els.volumeSlider.addEventListener('input', (event) => {
      const value = Number(event.target.value);
      lastSliderValue = value;
      els.volumeValue.textContent = value + '%';
      if (volumeTimer) clearTimeout(volumeTimer);
      volumeTimer = setTimeout(() => {
        sendMessage({ type: 'volumeSet', data: { value } });
      }, 80);
    });

    els.volumeSlider.addEventListener('change', () => {
      if (volumeTimer) clearTimeout(volumeTimer);
      sendMessage({ type: 'volumeSet', data: { value: lastSliderValue } });
    });

    els.manageBtn.addEventListener('click', () => {
      stationEditorMode = 'add';
      els.stationModalTitle.textContent = 'Add Station';
      els.stationNameInput.value = '';
      els.stationUrlInput.value = '';
      els.stationModal.classList.add('open');
      els.stationModal.setAttribute('aria-hidden', 'false');
    });

    els.cancelStationBtn.addEventListener('click', () => {
      els.stationModal.classList.remove('open');
      els.stationModal.setAttribute('aria-hidden', 'true');
    });

    els.saveStationBtn.addEventListener('click', () => {
      const name = els.stationNameInput.value.trim();
      const url = els.stationUrlInput.value.trim();
      if (!name || !url) {
        setStatus('Name and URL are required');
        return;
      }
      const message = { type: 'stationAdd', data: { name, url } };
      sendMessage(message);
      els.stationModal.classList.remove('open');
      els.stationModal.setAttribute('aria-hidden', 'true');
    });

    document.addEventListener('keydown', (event) => {
      if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement.tagName)) return;
      if (event.key === 'ArrowUp') {
        event.preventDefault();
        sendMessage({ type: 'stationPrevious' });
      }
      if (event.key === 'ArrowDown') {
        event.preventDefault();
        sendMessage({ type: 'stationNext' });
      }
    });

    connectWebSocket();
  </script>
</body>
</html>
